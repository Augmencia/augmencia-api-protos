syntax = "proto3";

package Augmencia.Protos;

message ServerConfig {
	string version = 1;
	string altcha_url = 2;
	string dashboard_url = 3;
	string oidc_authority = 4;
	string oidc_client_id = 5;
	bool require_oidc_profiles = 6;
	bool can_create_users = 7;
	optional string edit_profile_url = 8;
}
